<!doctype html><title>carousel</title><style>main{padding:20px}.swiper{height:0;overflow:hidden;background:#eee}.swiper.active{height:160px}</style><main><div class="swiper" id="carousel">Synthetic carousel</div><p id="content">This content moves when the carousel starts.</p></main><script>const afterFirstPaint = (fn, ms) => new PerformanceObserver((list, observer) => { observer.disconnect(); setTimeout(fn, ms); }).observe({ type: 'paint', buffered: true }); afterFirstPaint(() => document.querySelector('#carousel').classList.add('active'), 300);</script>
