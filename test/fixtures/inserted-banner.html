<!doctype html><title>inserted banner</title><style>main{padding:20px}.banner{height:70px;background:#ddd}</style><main id="main"><p id="content">This content moves below the inserted banner.</p></main><script>const afterFirstPaint = (fn, ms) => new PerformanceObserver((list, observer) => { observer.disconnect(); setTimeout(fn, ms); }).observe({ type: 'paint', buffered: true }); afterFirstPaint(() => { const banner = document.createElement('div'); banner.id = 'banner'; banner.className = 'banner'; banner.textContent = 'Synthetic banner'; document.querySelector('#main').prepend(banner); }, 300);</script>
