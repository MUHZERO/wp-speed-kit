<!doctype html><title>large shift</title><style>body{margin:0}.banner{height:200px;background:#ddd}#content{height:100vh;background:#9cf}</style><main id="main"><div id="content">This block fills the screen and moves below the inserted banner.</div></main><script>const afterFirstPaint = (fn, ms) => new PerformanceObserver((list, observer) => { observer.disconnect(); setTimeout(fn, ms); }).observe({ type: 'paint', buffered: true }); afterFirstPaint(() => { const banner = document.createElement('div'); banner.className = 'banner'; document.querySelector('#main').prepend(banner); }, 300);</script>
