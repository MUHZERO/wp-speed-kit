<!doctype html><title>late font</title><style>main{padding:20px}#content{font-family:'Late Font',sans-serif;font-size:16px;width:190px}</style><main><p id="content">A deliberately wrapping line of synthetic text changes size after the font event.</p></main><script>const afterFirstPaint = (fn, ms) => new PerformanceObserver((list, observer) => { observer.disconnect(); setTimeout(fn, ms); }).observe({ type: 'paint', buffered: true }); afterFirstPaint(() => { document.querySelector('#content').style.fontSize = '34px'; document.fonts.dispatchEvent(new Event('loadingdone')); }, 300);</script>
