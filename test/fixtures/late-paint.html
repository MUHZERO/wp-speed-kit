<!doctype html><script>const afterFirstPaint = (fn, ms) => new PerformanceObserver((list, observer) => { observer.disconnect(); setTimeout(fn, ms); }).observe({ type: 'paint', buffered: true }); afterFirstPaint(() => { const banner = document.createElement('div'); banner.className = 'banner'; document.querySelector('#main').prepend(banner); }, 300);</script><link rel="stylesheet" href="/late.css?delay=600"><title>late first paint</title><style>main{padding:20px}.banner{height:70px;background:#ddd}</style><main id="main"><p id="content">The first paint comes after the timer, as on a slow CI runner.</p></main>
