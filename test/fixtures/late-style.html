<!doctype html><title>late style</title><main><h1 id="heading">Late stylesheet</h1><p id="content">This content moves after stylesheet application.</p></main><script>const afterFirstPaint = (fn, ms) => new PerformanceObserver((list, observer) => { observer.disconnect(); setTimeout(fn, ms); }).observe({ type: 'paint', buffered: true }); afterFirstPaint(() => { const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '/late.css?delay=100'; document.head.append(link); }, 300);</script>
