<!doctype html><title>unsized image</title><style>body{margin:0}main{padding:20px}img{display:block;width:100%;height:0;object-fit:cover}</style><main><img id="photo" alt="synthetic"><p id="content">This content moves when the image gets its height.</p></main><script>const afterFirstPaint = (fn, ms) => new PerformanceObserver((list, observer) => { observer.disconnect(); setTimeout(fn, ms); }).observe({ type: 'paint', buffered: true }); afterFirstPaint(() => { const image = document.querySelector('#photo'); image.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"/>'; image.style.height = '180px'; }, 300);</script>
